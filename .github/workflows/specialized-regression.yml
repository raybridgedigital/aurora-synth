name: Aurora v1 Specialized Regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-v1-specialized-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  factory-audio:
    name: Current Factory Audio Audit · ${{ matrix.bank }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bank:
          - Aurora100
          - AuroraPrism100
          - AuroraNova100
          - AuroraGB109
          - AuroraShimmer29
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile v1 factory audio audit
        shell: bash
        run: |
          mkdir -p build
          xcrun clang++ -std=c++20 -O2 -fobjc-arc -I Sources Sources/SynthEngine.cpp Sources/FmEngine.cpp Tests/V1FactoryAudioAudit.mm -framework Foundation -o build/V1FactoryAudioAudit
      - name: Audit current factory bank
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.bank }} ==="
          build/V1FactoryAudioAudit "Resources/${{ matrix.bank }}.json" "build/${{ matrix.bank }}-v1-audio-audit.json"

  ab-comparison:
    name: Isolated A-B Comparison
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build standalone app
        shell: bash
        run: |
          rm -rf build
          bash scripts/build.sh
      - name: Run isolated A-B regression
        shell: bash
        run: |
          bash check-v1-ab-comparison.sh

  model-workflows:
    name: Reconstructed Model + UI Workflows
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build standalone app
        shell: bash
        run: |
          rm -rf build
          bash scripts/build.sh
      - name: Run reconstructed specialized regression
        shell: bash
        env:
          NSUnbufferedIO: "YES"
        run: |
          bash check-v1-specialized-regression.sh
      - name: Dump crash report on failure
        if: failure()
        shell: bash
        run: |
          LATEST=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"V1SpecializedRegression-*.ips 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "no crash report found"; exit 0; fi
          echo "=== $LATEST ==="
          tail -n +2 "$LATEST" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          ft=d.get('faultingThread',0)
          imgs=d.get('usedImages',[])
          def name(f):
              i=f.get('imageIndex',0)
              n=imgs[i].get('name','?') if i<len(imgs) else '?'
              return f\"{n} {f.get('symbol','')} +{f.get('symbolLocation', f.get('imageOffset',0))}\"
          frames=d['threads'][ft].get('frames',[])
          print('faultingThread:',ft)
          for f in frames[:25]: print(name(f))
          "
