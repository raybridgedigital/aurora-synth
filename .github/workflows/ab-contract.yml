name: Aurora A-B Contract

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aurora-ab-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab-contract:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone app
        shell: bash
        run: |
          rm -rf build
          bash scripts/build.sh
      - name: Run isolated A-B contract
        shell: bash
        run: bash check-ab-contract.sh
