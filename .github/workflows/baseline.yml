name: Aurora v1 Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-v1-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Current Architecture Baseline
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Aurora v1 baseline
        shell: bash
        run: bash scripts/test-baseline.sh

  address-undefined:
    name: Baseline ASan + UBSan
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run baseline with AddressSanitizer and UBSan
        shell: bash
        env:
          AURORA_SANITIZER: address-undefined
        run: bash scripts/test-baseline.sh

  thread:
    name: Baseline TSan
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run baseline with ThreadSanitizer
        shell: bash
        env:
          AURORA_SANITIZER: thread
        run: bash scripts/test-baseline.sh
